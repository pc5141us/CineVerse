<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة الأفلام والمحتوى | CineVerse</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- درع منع الإعلانات والنوافذ المنبثقة -->
  <script src="js/anti-ad.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- الهيدر -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🎬</div>
        <div class="brand-text">
          <span class="brand-title">CineVerse</span>
          <span class="brand-subtitle">لوحة التحكم وإدارة الأفلام</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="index.html" class="nav-btn primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>العودة للموقع</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">
    
    <!-- عنوان الصفحة والعمليات السريعة -->
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 1.85rem; font-weight: 800; color: #fff;">لوحة إدارة الأفلام والمحتوى</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">يمكنك من هنا إضافة أفلام أجنبية جديدة، تعديل المحتوى، وتصدير أو استيراد البيانات.</p>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
        <button type="button" id="exportJsonBtn" class="nav-btn" title="تصدير كـ JSON">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>تصدير نسخة احتياطية</span>
        </button>

        <label class="nav-btn" style="cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>استيراد ملف JSON</span>
          <input type="file" id="importJsonInput" accept=".json" style="display: none;">
        </label>

        <button type="button" id="resetDefaultBtn" class="nav-btn" style="color: #ff6b72;" title="استعادة الأفلام الافتراضية">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span>استعادة الافتراضي</span>
        </button>
      </div>
    </div>

    <!-- نموذج إضافة فيلم جديد -->
    <div class="admin-card">
      <div style="display: flex; align-items: center; gap: 0.65rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.85rem;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-gold)" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <h2 style="font-size: 1.35rem; font-weight: 700; color: #fff;">إضافة فيلم أجنبي جديد</h2>
      </div>

      <form id="addMovieForm">
        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="movieTitle">اسم الفيلم بالإنجليزية *</label>
            <input type="text" id="movieTitle" class="form-control" placeholder="مثال: Gladiator II" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="movieTitleAr">اسم الفيلم بالعربية</label>
            <input type="text" id="movieTitleAr" class="form-control" placeholder="مثال: المصارع 2">
          </div>
        </div>

        <div class="form-row-3">
          <div class="form-group">
            <label class="form-label" for="movieYear">سنة الإنتاج *</label>
            <input type="number" id="movieYear" class="form-control" value="2024" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="movieRating">تقييم IMDb (من 10) *</label>
            <input type="number" step="0.1" min="1" max="10" id="movieRating" class="form-control" value="8.0" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="movieQuality">الجودة *</label>
            <select id="movieQuality" class="form-control">
              <option value="4K UHD">4K UHD</option>
              <option value="1080p BluRay">1080p BluRay</option>
              <option value="1080p Web-DL">1080p Web-DL</option>
              <option value="720p HD">720p HD</option>
            </select>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="movieDuration">مدة العرض</label>
            <input type="text" id="movieDuration" class="form-control" placeholder="مثال: 2h 28m">
          </div>
          <div class="form-group">
            <label class="form-label" for="movieGenres">التصنيفات (مفصولة بفواصل)</label>
            <input type="text" id="movieGenres" class="form-control" placeholder="أكشن, خيال علمي, مغامرة">
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="moviePoster">رابط صورة البوستر (Poster URL)</label>
            <input type="url" id="moviePoster" class="form-control" placeholder="https://image.tmdb.org/t/p/w500/...">
          </div>
          <div class="form-group">
            <label class="form-label" for="movieBackdrop">رابط صورة الخلفية العريضة (Backdrop URL)</label>
            <input type="url" id="movieBackdrop" class="form-control" placeholder="https://image.tmdb.org/t/p/original/...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="movieStory">قصة الفيلم بالعربية</label>
          <textarea id="movieStory" class="form-control" style="min-height: 90px; resize: vertical;" placeholder="ملخص وقصة الفيلم..."></textarea>
        </div>

        <div class="form-row-3">
          <div class="form-group">
            <label class="form-label" for="movieTrailer">معرف تريلر يوتيوب (YouTube Video ID)</label>
            <input type="text" id="movieTrailer" class="form-control" placeholder="مثال: 4rgYUipGJNo">
          </div>
          <div class="form-group">
            <label class="form-label" for="movieServer1">رابط سيرفر المشاهدة (Stream Embed URL)</label>
            <input type="url" id="movieServer1" class="form-control" placeholder="https://vidsrc.to/embed/movie/...">
          </div>
          <div class="form-group">
            <label class="form-label" for="movieDownload4k">رابط التحميل المباشر</label>
            <input type="url" id="movieDownload4k" class="form-control" placeholder="https://mega.nz/#... أو https://mediafire.com/#...">
          </div>
        </div>

        <div style="margin-top: 1.5rem; text-align: left;">
          <button type="submit" class="btn-hero play" style="padding: 0.85rem 2.2rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            إضافة الفيلم للموقع فوراً
          </button>
        </div>
      </form>
    </div>

    <!-- جدول الأفلام الحالية -->
    <div class="admin-card">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.35rem; font-weight: 700; color: #fff;">الأفلام المسجلة في الموقع</h2>
        <span id="totalMoviesBadge" class="badge-count" style="font-size: 0.88rem; padding: 4px 12px;">0 فيلم</span>
      </div>

      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: right; font-size: 0.9rem;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border-subtle); color: var(--text-dim); font-size: 0.82rem;">
              <th style="padding: 0.85rem 1rem;">#</th>
              <th style="padding: 0.85rem 1rem;">البوستر</th>
              <th style="padding: 0.85rem 1rem;">عنوان الفيلم</th>
              <th style="padding: 0.85rem 1rem;">السنة</th>
              <th style="padding: 0.85rem 1rem;">التقييم</th>
              <th style="padding: 0.85rem 1rem;">الجودة</th>
              <th style="padding: 0.85rem 1rem;">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="moviesAdminTableBody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <div id="toastContainer" class="toast-container"></div>

  <!-- ملفات الجافاسكريبت -->
  <script src="js/movies-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
